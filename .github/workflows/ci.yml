name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnd-web-game/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: dnd-web-game/backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify the app imports
        run: python -c "import app.main"
      - name: Run tests
        run: python -m pytest -q

  frontend:
    name: Frontend (jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dnd-web-game/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: dnd-web-game/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
